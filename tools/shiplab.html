<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ship workshop</title>
<link rel="icon" href="data:," />
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2620; } canvas { display: block; }
#lbl { position: fixed; left: 10px; top: 8px; font: 13px/1.3 Georgia, serif; color: #f3e6c4; text-shadow: 0 1px 2px #000; }</style>
</head>
<body>
<div id="lbl"></div>
<script type="module">
// Ship workshop (dev tool, not in the build): one procedural ship model on a flat sea under a plain sun, without the
// game around it. Loads in a few seconds, for modelling iterations; the in-game check stays ?shot=ships&view=one.
//   /tools/shiplab.html?type=frigate&faction=english&cam=quarter|side|stern|bow|deck|head|top|waist|rig&set=0.5&far=0
//   &pos=x,y,z&look=x,y,z overrides the camera (ship-local metres: x starboard, y up, z aft).
//   window.__labReady turns true once the image is stable; window.__labInfo = { tris, farTris, sailTris, verts }.
//   Captures: node tools/shiplab-shot.mjs <folder> <type> [cam…]
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildShipModel } from '/src/ships/shipModel.js';

const q = new URLSearchParams(location.search);
const type = q.get('type') || 'frigate', cam = q.get('cam') || 'quarter';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
scene.background = new THREE.Color('#a9cbe0');
scene.add(new THREE.HemisphereLight('#bcd8ee', '#3d5a70', 0.9));
const sun = new THREE.DirectionalLight('#fff0d8', 2.6);

const model = buildShipModel(type, { faction: q.get('faction') || 'english', seed: 7, sailSetting: parseFloat(q.get('set') || '0.5') });
scene.add(model.group);
const L = model.length;
sun.position.set(L * 0.7, L * 1.1, L * 0.9); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = -L; sc.right = L; sc.top = L * 1.3; sc.bottom = -L * 0.5; sc.far = L * 4;
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03; scene.add(sun);
const sea = new THREE.Mesh(new THREE.PlaneGeometry(L * 40, L * 40), new THREE.MeshStandardMaterial({ color: '#2f6f93', roughness: 0.35 }));
sea.rotation.x = -Math.PI / 2; sea.receiveShadow = true; scene.add(sea);

// ship-local frame: bow at -Z, starboard +X
const cams = {
  quarter: [[L * 0.75, L * 0.32, L * 0.95], [0, L * 0.26, 0]],
  side: [[L * 1.45, L * 0.22, 0], [0, L * 0.3, 0]],
  stern: [[L * 0.3, L * 0.2, L * 0.92], [0, L * 0.12, L * 0.3]],
  bow: [[L * 0.42, L * 0.16, -L * 0.95], [0, L * 0.12, -L * 0.3]],
  head: [[L * 0.22, L * 0.2, -L * 0.72], [0, L * 0.1, -L * 0.42]],
  deck: [[L * 0.16, L * 0.42, L * 0.2], [0, L * 0.1, -L * 0.08]],
  waist: [[L * 0.5, L * 0.13, -L * 0.02], [0, L * 0.09, -L * 0.02]],
  top: [[L * 0.02, L * 1.25, L * 0.05], [0, 0, 0]],
  rig: [[L * 0.55, L * 0.5, L * 0.35], [0, L * 0.55, -L * 0.05]],
  far: [[L * 3.2, L * 0.6, L * 2.4], [0, L * 0.3, 0]],
}[cam] || [[L, L * 0.4, L], [0, L * 0.25, 0]];
const v = (s, d) => (s ? s.split(',').map(Number) : d);
const camera = new THREE.PerspectiveCamera(cam === 'far' ? 30 : 40, innerWidth / innerHeight, 0.3, L * 60);
camera.position.set(...v(q.get('pos'), cams[0])); camera.lookAt(...v(q.get('look'), cams[1]));

const hull = model.group.children[0];
if (q.get('far') === '1') {   // far LOD preview: the shared far index of the cached type geometry
  const g = new THREE.BufferGeometry();
  for (const [k, a] of Object.entries(hull.geometry.attributes)) g.setAttribute(k, a);
  g.setIndex(new THREE.BufferAttribute(hull.geometry.userData.farIndex, 1)); hull.geometry = g;
}
model.update(0, 0, { sailSetting: parseFloat(q.get('set') || '0.5'), windRel: parseFloat(q.get('wind') || '2.35'), speed: 6 });
const info = {
  tris: Math.round(model.group.children[0].geometry.index.count / 3),
  farTris: Math.round((model.group.children[0].geometry.userData.farIndex?.length || 0) / 3),
  sailTris: Math.round(model.group.children[1].geometry.index.count / 3),
  verts: model.group.children[0].geometry.attributes.position.count,
};
document.getElementById('lbl').textContent = q.get('label') === '0' ? '' : `${type} — ${info.tris} tris (far ${info.farTris}), sails ${info.sailTris}, ${info.verts} verts`;
window.__labInfo = info;
let n = 0;
renderer.setAnimationLoop(() => { renderer.render(scene, camera); if (++n === 4) { window.__labReady = true; renderer.setAnimationLoop(null); } });
</script>
</body>
</html>
